name: Reproducibility check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  reproducibility-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Parse R scripts
        shell: Rscript {0}
        run: |
          files <- c(
            list.files(pattern = "[.]R$", full.names = TRUE),
            list.files("scripts", pattern = "[.]R$", full.names = TRUE,
                       recursive = TRUE),
            list.files("utils", pattern = "[.]R$", full.names = TRUE,
                       recursive = TRUE)
          )
          for (file in files) parse(file)
          message("Parsed ", length(files), " R files successfully.")

      - name: Run reviewer demonstration
        run: Rscript calc-loss-stochastic.R

      - name: Rebuild summarized manuscript outputs
        run: Rscript scripts/publish-summarized-manuscript-outputs.R

      - name: Reproduce all public figures
        run: Rscript make-figures.R --strict

      - name: Upload reproduced outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-manuscript-artifacts
          path: |
            out/demo-simulation/
            out/manuscript-summary/
            figs/
          if-no-files-found: warn
